name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare RuStore App Icon
        run: |
          pip install pillow
          python3 -c '
          from PIL import Image
          img = Image.open("icon.png").convert("RGB")
          w, h = img.size
          crop = int(w * 0.04)
          img = img.crop((crop, crop, w - crop, h - crop)).resize((512, 512), Image.LANCZOS)
          img.save("icon.png", format="PNG", optimize=True)
          '

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.budget.expenses --project-name budget_expenses .
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); s=s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1); s=s.replace("android:label=\"budget_expenses\"", "android:label=\"Бюджет и Расходы\""); open(p,"w").write(s)'

      - name: Get dependencies & Apply Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Expenses-RU-APK
          path: build/app/outputs/flutter-apk/app-release.apk
