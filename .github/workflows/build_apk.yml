name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android project files
        run: |
          flutter create --platforms=android .
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); open(p,"w").write(s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1))'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinFlow-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
